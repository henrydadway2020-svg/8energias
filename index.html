<style>
  :root {
    --bg: #12141A;
    --panel: #1B1E27;
    --panel-alt: #20242F;
    --line: #2B2F3B;
    --text: #E7E9EE;
    --muted: #8D93A3;
    --accent: #F2B441;
    --blue: #4F9FE0;
    --danger: #D9736E;
    --danger-dark: #4A2220;
    --success: #6FBB6C;
    --success-bg: #DCEFDB;
    --success-text: #123B22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  h1, h2, .display { font-family: 'Rajdhani', sans-serif; font-weight: 700; }
  button { font-family: 'Inter', sans-serif; cursor: pointer; }
  input, textarea { font-family: 'Inter', sans-serif; }
  .btn { font-weight: 500; font-size: 13.5px; padding: 9px 16px; border-radius: 6px; border: 1px solid transparent; transition: filter .12s ease; }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sm { font-size: 12.5px; padding: 5px 10px; }
  .btn-primary { background: var(--accent); color: #241B04; border-color: var(--accent); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--line); }
  .btn-ghost { background: var(--panel-alt); color: var(--text); border-color: var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-dark); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--panel-alt); border: 1px solid var(--line); }
  .energy-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 20px; color: #0B0C0F; }
  .energy-dot { width: 7px; height: 7px; border-radius: 50%; background: #0B0C0F; opacity: .55; }
  input[type=text], textarea {
    width: 100%; background: var(--panel-alt); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; color: var(--text); font-size: 14px;
  }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; font-size: 13.5px; border-bottom: none; }
  .tab-btn { padding: 12px 16px; background: transparent; border: none; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .bar-row { display: grid; grid-template-columns: 140px 1fr 34px; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-track { background: var(--panel-alt); border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  ::placeholder { color: var(--muted); opacity: .7; }
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================================
   CONFIGURACIÓN DE FIREBASE — PEGA AQUÍ TUS DATOS
   Ve a https://console.firebase.google.com, crea un proyecto gratis,
   activa "Firestore Database" y registra una app web. Copia el objeto
   firebaseConfig que te da Firebase y reemplaza el de abajo.
   ========================================================================= */
var firebaseConfig = {
  apiKey: "AIzaSyAyMby2SSQiWIlqwC0lTBsFnH5PDGZ8Nns",
  authDomain: "energias-8b582.firebaseapp.com",
  projectId: "energias-8b582",
  storageBucket: "energias-8b582.firebasestorage.app",
  messagingSenderId: "273381442392",
  appId: "1:273381442392:web:83ff58a5aa0b21e0e55b2d"
};

/* ---------- constants ---------- */
var ENERGY_TYPES = [
  { name: 'Fuego', color: '#E8683D' },
  { name: 'Agua', color: '#4F9FE0' },
  { name: 'Planta', color: '#5FAE5C' },
  { name: 'Rayo', color: '#F2C230' },
  { name: 'Psíquico', color: '#B07CC6' },
  { name: 'Lucha', color: '#C1584A' },
  { name: 'Oscuridad', color: '#8B85A0' },
  { name: 'Metal', color: '#9BA6B0' }
];
var MIN_PLAYERS = 32;
var MAX_PLAYERS = 128;
var TOURNAMENT_DOC_ID = 'main'; /* un solo torneo por cada despliegue de esta página */

/* ---------- ephemeral UI + synced state ---------- */
var ui = { tab: 'ronda', viewRoundIdx: null, confirmReset: false, formError: '', loading: true, loadError: false };
var state = null; /* se llena en vivo desde Firestore */

/* ---------- firebase / firestore refs ---------- */
var db = null;
var unsubMeta = null, unsubPlayers = null, unsubRounds = null;
var deckListenerUnsub = null, deckListenerRoundNumber = null;

function tournamentRef() { return db.collection('tournaments').doc(TOURNAMENT_DOC_ID); }
function playersRef() { return tournamentRef().collection('players'); }
function roundsRef() { return tournamentRef().collection('rounds'); }
function decksRef() { return tournamentRef().collection('decks'); }

function handleWriteError(err) {
  console.error(err);
  ui.formError = 'save';
  render();
}

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    ui.loading = false; ui.loadError = true; render();
    return;
  }
  unsubMeta = tournamentRef().onSnapshot(function (doc) {
    if (!doc.exists) {
      if (unsubPlayers) { unsubPlayers(); unsubPlayers = null; }
      if (unsubRounds) { unsubRounds(); unsubRounds = null; }
      if (deckListenerUnsub) { deckListenerUnsub(); deckListenerUnsub = null; deckListenerRoundNumber = null; }
      state = null;
      ui.loading = false;
      render();
      return;
    }
    var d = doc.data();
    if (!state) state = { players: [], rounds: [] };
    state.name = d.name; state.pin = d.pin; state.createdAt = d.createdAt;
    if (!unsubPlayers) startTournamentListeners();
    ui.loading = false;
    render();
  }, function (err) {
    console.error(err);
    ui.loading = false; ui.loadError = true; render();
  });
}

function startTournamentListeners() {
  unsubPlayers = playersRef().orderBy('joinedAt', 'asc').onSnapshot(function (snap) {
    var players = [];
    snap.forEach(function (doc) {
      var d = doc.data();
      players.push({ id: doc.id, name: d.name, photo: d.photo || null });
    });
    if (!state) state = { players: [], rounds: [] };
    state.players = players;
    render();
  }, function (err) { console.error(err); });

  unsubRounds = roundsRef().orderBy('number', 'asc').onSnapshot(function (snap) {
    var rounds = [];
    snap.forEach(function (doc) {
      var d = doc.data();
      var existing = (state && state.rounds || []).find(function (r) { return r.number === d.number; });
      rounds.push({
        number: d.number,
        energyType: d.energyType,
        matches: d.matches || [],
        deckFlags: d.deckFlags || {},
        decks: (existing && existing.decks) || {}
      });
    });
    if (!state) state = { players: [], rounds: [] };
    state.rounds = rounds;
    render();
  }, function (err) { console.error(err); });
}

/* Solo se pide la imagen de la ronda que se está viendo — evita bajar todas
   las fotos de mazo de las 8 rondas de golpe. */
function ensureDeckListener(roundNumber) {
  if (deckListenerRoundNumber === roundNumber) return;
  if (deckListenerUnsub) deckListenerUnsub();
  deckListenerRoundNumber = roundNumber;
  deckListenerUnsub = decksRef().where('roundNumber', '==', roundNumber).onSnapshot(function (snap) {
    var map = {};
    snap.forEach(function (doc) { var d = doc.data(); map[d.playerId] = { image: d.image || null }; });
    var r = state && state.rounds.find(function (rr) { return rr.number === roundNumber; });
    if (r) { r.decks = map; render(); }
  }, function (err) { console.error(err); });
}

/* ---------- helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function pairKey(a, b) { return [a, b].sort().join('::'); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function playerName(st, id) { var p = st.players.find(function (pl) { return pl.id === id; }); return p ? p.name : '—'; }
function playerPhoto(st, id) { var p = st.players.find(function (pl) { return pl.id === id; }); return p && p.photo ? p.photo : null; }
function avatarHtml(st, id, size) {
  var photo = playerPhoto(st, id);
  var name = playerName(st, id);
  var initial = esc((name || '?').trim().charAt(0).toUpperCase() || '?');
  var base = 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;flex-shrink:0;border:1px solid var(--line);';
  if (photo) return '<img src="' + photo + '" style="' + base + 'object-fit:cover;" />';
  return '<span style="' + base + 'display:inline-flex;align-items:center;justify-content:center;background:var(--panel-alt);color:var(--muted);font-size:' + Math.round(size * 0.42) + 'px;font-weight:700;">' + initial + '</span>';
}

/* ---------- organizer lock ---------- */
/* Los jugadores solo pueden registrarse (nick + foto) y subir SU mazo de la
   ronda actual. Cualquier otra acción (reportar resultados, generar rondas,
   corregir, reiniciar, editar un mazo ya guardado, quitar a un jugador) pide
   el PIN del organizador. El desbloqueo dura mientras la pestaña del
   navegador siga abierta en ESE dispositivo (sessionStorage) — cada
   dispositivo que administre el torneo debe desbloquearlo por su cuenta.
   Nota: como los datos viven en Firestore con reglas abiertas para que
   funcione sin backend propio, el PIN es un candado de uso (evita que un
   jugador cualquiera toque cosas por accidente), no una seguridad a prueba
   de todo — cualquiera con las reglas del proyecto podría leer/escribir
   directamente. */
function lockFlagKey() { return 'organizerUnlocked_tcgPocketTournament'; }
function isUnlocked() { try { return sessionStorage.getItem(lockFlagKey()) === '1'; } catch (e) { return false; } }
function lockOrganizer() { try { sessionStorage.removeItem(lockFlagKey()); } catch (e) {} render(); }
function requireUnlock(action) {
  if (isUnlocked()) { action(); return; }
  var pin = window.prompt('PIN de organizador para confirmar esta acción:');
  if (pin === null) return;
  if (state && pin === state.pin) {
    try { sessionStorage.setItem(lockFlagKey(), '1'); } catch (e) {}
    action();
  } else {
    alert('PIN incorrecto.');
  }
}
function unlockOrganizer() { requireUnlock(function () { render(); }); }

function computeStandings(st) {
  var standings = {};
  st.players.forEach(function (p) { standings[p.id] = { id: p.id, name: p.name, points: 0, wins: 0, losses: 0, gamesWon: 0, gamesLost: 0, byes: 0 }; });
  st.rounds.forEach(function (round) {
    round.matches.forEach(function (m) {
      if (m.bye) { var s = standings[m.p1]; if (s) { s.points += 1; s.wins += 1; s.byes += 1; } return; }
      if (m.status !== 'done') return;
      var s1 = standings[m.p1], s2 = standings[m.p2];
      if (!s1 || !s2) return;
      s1.gamesWon += m.p1g; s1.gamesLost += m.p2g;
      s2.gamesWon += m.p2g; s2.gamesLost += m.p1g;
      if (m.winner === m.p1) { s1.points += 1; s1.wins += 1; s2.losses += 1; }
      else if (m.winner === m.p2) { s2.points += 1; s2.wins += 1; s1.losses += 1; }
    });
  });
  return standings;
}

function generatePairings(st) {
  var standings = computeStandings(st);
  var played = new Set();
  st.rounds.forEach(function (r) { r.matches.forEach(function (m) { if (!m.bye) played.add(pairKey(m.p1, m.p2)); }); });
  var sorted = st.players.map(function (p) { return p.id; }).sort(function (a, b) {
    var sa = standings[a], sb = standings[b];
    if (sb.points !== sa.points) return sb.points - sa.points;
    var da = sa.gamesWon - sa.gamesLost, db = sb.gamesWon - sb.gamesLost;
    if (db !== da) return db - da;
    return 0;
  });
  var unpaired = sorted.slice();
  var byeId = null;
  if (unpaired.length % 2 === 1) {
    for (var i = unpaired.length - 1; i >= 0; i--) {
      if (standings[unpaired[i]].byes === 0) { byeId = unpaired[i]; unpaired.splice(i, 1); break; }
    }
    if (byeId === null) byeId = unpaired.pop();
  }
  var pairs = [];
  while (unpaired.length) {
    var p1 = unpaired.shift();
    var idx = unpaired.findIndex(function (p2) { return !played.has(pairKey(p1, p2)); });
    if (idx === -1) idx = 0;
    var p2 = unpaired.splice(idx, 1)[0];
    pairs.push([p1, p2]);
  }
  return { pairs: pairs, byeId: byeId };
}

function makeMatches(pairs, byeId) {
  var matches = pairs.map(function (pr) { return { id: uid(), p1: pr[0], p2: pr[1], p1g: 0, p2g: 0, status: 'pending', winner: null, bye: false }; });
  if (byeId) matches.push({ id: uid(), p1: byeId, p2: null, p1g: 2, p2g: 0, status: 'done', winner: byeId, bye: true });
  return matches;
}

/* ---------- tournament creation ---------- */
function createTournament() {
  var name = document.getElementById('tournamentName').value.trim();
  var pin = document.getElementById('organizerPin').value.trim();
  var errEl = document.getElementById('setupError');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Ponle un nombre al torneo.'; return; }
  if (!pin || pin.length < 4) { errEl.textContent = 'Define un PIN de organizador de al menos 4 caracteres — lo pedirá la app para reportar resultados, generar rondas o corregir cosas.'; return; }
  tournamentRef().set({ name: name, pin: pin, createdAt: Date.now() }).catch(function (err) {
    console.error(err);
    errEl.textContent = 'No se pudo crear el torneo. Revisa tu conexión y que hayas pegado bien la configuración de Firebase al inicio del archivo.';
  });
}

/* ---------- self-registration (jugadores se unen con nick + foto) ---------- */
function addPlayerSelf() {
  var nameInput = document.getElementById('joinName');
  var fileInput = document.getElementById('joinPhoto');
  var errEl = document.getElementById('joinError');
  var btn = document.getElementById('joinBtn');
  var name = nameInput ? nameInput.value.trim() : '';
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (errEl) errEl.textContent = '';
  if (!name) { if (errEl) errEl.textContent = 'Escribe tu nick para unirte.'; return; }
  if (state.players.length >= MAX_PLAYERS) { if (errEl) errEl.textContent = 'El torneo ya alcanzó el máximo de ' + MAX_PLAYERS + ' jugadores.'; return; }
  var dup = state.players.some(function (p) { return p.name.trim().toLowerCase() === name.toLowerCase(); });
  if (dup) { if (errEl) errEl.textContent = 'Ese nick ya está registrado, elige otro.'; return; }
  if (!file) { if (errEl) errEl.textContent = 'Sube una foto tuya (o de tu carta favorita) para identificarte.'; return; }
  if (file.type !== 'image/png' && file.type !== 'image/jpeg') { if (errEl) errEl.textContent = 'La imagen debe ser JPG o PNG.'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Uniéndote…'; }
  compressImageFile(file, 480, 0.6).then(function (photo) {
    return playersRef().add({ name: name, photo: photo, joinedAt: Date.now() });
  }).then(function () {
    if (btn) { btn.disabled = false; btn.textContent = 'Unirme al torneo'; }
    if (nameInput) nameInput.value = '';
    if (fileInput) fileInput.value = '';
    var preview = document.getElementById('joinPhoto-preview');
    if (preview) preview.innerHTML = '';
  }).catch(function (err) {
    console.error(err);
    if (errEl) errEl.textContent = 'No se pudo unir al torneo, revisa tu conexión e intenta de nuevo.';
    if (btn) { btn.disabled = false; btn.textContent = 'Unirme al torneo'; }
  });
}

function removePlayer(playerId) {
  requireUnlock(function () {
    playersRef().doc(playerId).delete().catch(handleWriteError);
  });
}

/* ---------- rounds ---------- */
function generateRound() {
  requireUnlock(function () {
    if (state.rounds.length === 0 && state.players.length < MIN_PLAYERS) {
      alert('Necesitas al menos ' + MIN_PLAYERS + ' jugadores registrados para generar la ronda 1 (llevas ' + state.players.length + '). Ve a la pestaña "Jugadores".');
      return;
    }
    var num = state.rounds.length + 1;
    var pr = generatePairings(state);
    var energyType = ENERGY_TYPES[(num - 1) % ENERGY_TYPES.length].name;
    var matches = makeMatches(pr.pairs, pr.byeId);
    roundsRef().doc(String(num)).set({ number: num, energyType: energyType, matches: matches, deckFlags: {} }).catch(handleWriteError);
    ui.viewRoundIdx = null;
  });
}

function findRoundByMatch(matchId) {
  return state.rounds.find(function (r) { return r.matches.some(function (m) { return m.id === matchId; }); });
}
function writeRoundMatches(roundNumber, matches) {
  roundsRef().doc(String(roundNumber)).update({ matches: matches }).catch(handleWriteError);
}
function updateMatch(matchId, updater) {
  var round = findRoundByMatch(matchId);
  if (!round) return;
  var newMatches = round.matches.map(function (m) { return m.id === matchId ? updater(m) : m; });
  writeRoundMatches(round.number, newMatches);
}

function incrementGame(matchId, side) {
  requireUnlock(function () {
    updateMatch(matchId, function (m) {
      if (m.status === 'done') return m;
      var p1g = m.p1g, p2g = m.p2g;
      if (side === 'p1') p1g++; else p2g++;
      var status = 'progress', winner = null;
      if (p1g >= 2) { status = 'done'; winner = m.p1; }
      else if (p2g >= 2) { status = 'done'; winner = m.p2; }
      return Object.assign({}, m, { p1g: p1g, p2g: p2g, status: status, winner: winner });
    });
  });
}
function decrementGame(matchId, side) {
  requireUnlock(function () {
    updateMatch(matchId, function (m) {
      if (m.status === 'done') return m;
      var p1g = m.p1g, p2g = m.p2g;
      if (side === 'p1' && p1g > 0) p1g--;
      if (side === 'p2' && p2g > 0) p2g--;
      return Object.assign({}, m, { p1g: p1g, p2g: p2g });
    });
  });
}
function resetMatch(matchId) {
  requireUnlock(function () {
    updateMatch(matchId, function (m) { return Object.assign({}, m, { p1g: 0, p2g: 0, status: 'pending', winner: null }); });
  });
}

/* ---------- per-round deck registration ---------- */
function previewDeckImage(inputId, previewId) {
  var fileInput = document.getElementById(inputId);
  var previewEl = document.getElementById(previewId);
  if (!fileInput || !previewEl) return;
  if (!fileInput.files || !fileInput.files[0]) { previewEl.innerHTML = ''; return; }
  var file = fileInput.files[0];
  if (file.type !== 'image/png' && file.type !== 'image/jpeg') {
    previewEl.innerHTML = '<p style="color:var(--danger);font-size:12px;margin:6px 0 0;">Solo se aceptan archivos JPG o PNG.</p>';
    return;
  }
  var url = URL.createObjectURL(file);
  previewEl.innerHTML = '<img src="' + url + '" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line);margin:8px 0;display:block;" />';
}

function compressImageFile(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { reject(new Error('img')); };
      img.src = reader.result;
    };
    reader.onerror = function () { reject(new Error('read')); };
    reader.readAsDataURL(file);
  });
}

function submitRoundDeck(roundNumber, playerId) {
  var idBase = 'rdeck-' + roundNumber + '-' + playerId;
  var errEl = document.getElementById(idBase + '-err');
  var fileInput = document.getElementById(idBase + '-img');
  var btn = document.getElementById(idBase + '-btn');
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) { if (errEl) errEl.textContent = 'Sube la captura de tu mazo para poder guardarlo.'; return; }
  if (file.type !== 'image/png' && file.type !== 'image/jpeg') { if (errEl) errEl.textContent = 'La imagen debe ser JPG o PNG.'; return; }
  if (errEl) errEl.textContent = '';
  function save(imageData) {
    var docId = roundNumber + '_' + playerId;
    return decksRef().doc(docId).set({ roundNumber: roundNumber, playerId: playerId, image: imageData || null }).then(function () {
      var patch = {}; patch['deckFlags.' + playerId] = true;
      return roundsRef().doc(String(roundNumber)).update(patch);
    });
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  compressImageFile(file, 720, 0.62).then(save).catch(function (err) {
    console.error(err);
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar mazo'; }
    if (errEl) errEl.textContent = 'No se pudo guardar, revisa tu conexión e intenta de nuevo.';
  });
}

function editRoundDeck(roundNumber, playerId) {
  requireUnlock(function () {
    var docId = roundNumber + '_' + playerId;
    decksRef().doc(docId).delete().then(function () {
      var patch = {}; patch['deckFlags.' + playerId] = firebase.firestore.FieldValue.delete();
      return roundsRef().doc(String(roundNumber)).update(patch);
    }).catch(handleWriteError);
  });
}

function setTab(t) { ui.tab = t; ui.viewRoundIdx = null; render(); }
function prevRound() { var idx = ui.viewRoundIdx === null ? state.rounds.length - 1 : ui.viewRoundIdx; ui.viewRoundIdx = Math.max(0, idx - 1); render(); }
function nextRound() { var idx = ui.viewRoundIdx === null ? state.rounds.length - 1 : ui.viewRoundIdx; ui.viewRoundIdx = Math.min(state.rounds.length - 1, idx + 1); render(); }

function showConfirmReset() { requireUnlock(function () { ui.confirmReset = true; render(); }); }
function cancelReset() { ui.confirmReset = false; render(); }

function deleteCollectionInChunks(ref) {
  return ref.get().then(function (snap) {
    var docs = snap.docs;
    var chunks = [];
    for (var i = 0; i < docs.length; i += 400) chunks.push(docs.slice(i, i + 400));
    return chunks.reduce(function (p, chunk) {
      return p.then(function () {
        var batch = db.batch();
        chunk.forEach(function (d) { batch.delete(d.ref); });
        return batch.commit();
      });
    }, Promise.resolve());
  });
}

function confirmResetYes() {
  requireUnlock(function () {
    Promise.all([
      deleteCollectionInChunks(playersRef()),
      deleteCollectionInChunks(roundsRef()),
      deleteCollectionInChunks(decksRef())
    ]).then(function () {
      return tournamentRef().delete();
    }).then(function () {
      try { sessionStorage.removeItem(lockFlagKey()); } catch (e) {}
      ui = { tab: 'ronda', viewRoundIdx: null, confirmReset: false, formError: '', loading: false, loadError: false };
      /* el listener de meta detecta que el doc ya no existe y limpia "state" solo */
    }).catch(function (err) {
      console.error(err);
      alert('No se pudo reiniciar por completo, revisa tu conexión e intenta de nuevo.');
    });
  });
}

/* ---------- render: match card ---------- */
function renderMatchCard(st, round, m) {
  if (m.bye) {

    var html = (
      '<div class="card" style="padding:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="display:flex;align-items:center;gap:10px;">' + avatarHtml(st, m.p1, 36) + '<div><p class="display" style="font-size:18px;margin:0;">' + p1 + '</p>' +
          '<p style="margin:2px 0 0;font-size:12.5px;color:var(--muted);">Descanso de la ronda — victoria automática</p></div></div>' +
          '<span class="badge" style="background:var(--success-bg);color:var(--success-text);border:none;">BYE</span>' +
        '</div>'
    );
    html += '<div style="margin-top:12px;">' + renderRoundDeckSlot(round, m.p1, playerName(st, m.p1)) + '</div>';
    html += '</div>';
    return html;
  }
  var p1n = esc(playerName(st, m.p1)), p2n = esc(playerName(st, m.p2));
  var hasDeck1 = !!(round.deckFlags && round.deckFlags[m.p1]);
  var hasDeck2 = !!(round.deckFlags && round.deckFlags[m.p2]);
  var done = m.status === 'done';
  var winnerName = done ? playerName(st, m.winner) : null;
  var c1 = winnerName === playerName(st, m.p1) ? 'var(--success)' : 'var(--text)';
  var c2 = winnerName === playerName(st, m.p2) ? 'var(--success)' : 'var(--text)';
  var html = '<div class="card" style="padding:16px;">';
  html += '<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;">';
  html += '<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;text-align:right;">' +
            '<p class="display" style="font-size:18px;margin:0;color:' + c1 + ';">' + p1n + '</p>' + avatarHtml(st, m.p1, 32) +
          '</div>';
  html += '<div style="display:flex;align-items:center;gap:8px;">' +
            '<span class="display" style="font-size:26px;color:var(--accent);min-width:24px;text-align:center;">' + m.p1g + '</span>' +
            '<span style="color:var(--muted);">–</span>' +
            '<span class="display" style="font-size:26px;color:var(--accent);min-width:24px;text-align:center;">' + m.p2g + '</span>' +
          '</div>';
  html += '<div style="display:flex;align-items:center;gap:8px;text-align:left;">' + avatarHtml(st, m.p2, 32) +
            '<p class="display" style="font-size:18px;margin:0;color:' + c2 + ';">' + p2n + '</p>' +
          '</div>';
  html += '</div>';

  var bothDecksIn = hasDeck1 && hasDeck2;

  if (!done) {
    if (!bothDecksIn) {
      html += '<p style="margin:14px 0 8px;font-size:12px;color:var(--muted);text-align:center;">Cada jugador registra su mazo de esta ronda antes de poder reportar el resultado.</p>';
      html += '<div style="display:grid;gap:10px;grid-template-columns:1fr 1fr;">';
      html += '<div>' + renderRoundDeckSlot(round, m.p1, playerName(st, m.p1)) + '</div>';
      html += '<div>' + renderRoundDeckSlot(round, m.p2, playerName(st, m.p2)) + '</div>';
      html += '</div>';
    } else {
      html += '<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:12px;">';
      html += '<div style="display:flex;justify-content:flex-end;gap:6px;">' +
                '<button class="btn btn-secondary btn-sm" ' + (m.p1g === 0 ? 'disabled' : '') + ' onclick="decrementGame(\'' + m.id + '\',\'p1\')">−</button>' +

/* ---------- render: round tab ---------- */
function renderRoundTab() {
  if (state.rounds.length === 0) {
    var joined = state.players.length;
    if (joined < MIN_PLAYERS) {
      return '<div class="card" style="text-align:center;padding:32px;">' +
        '<p class="display" style="font-size:20px;margin:0 0 8px;">Esperando jugadores</p>' +
        '<p style="color:var(--muted);font-size:13.5px;margin:0 0 18px;">Llevas ' + joined + ' de ' + MIN_PLAYERS + ' jugadores mínimos. Cada quien se registra con su nick y una foto en la pestaña "Jugadores", desde su propio celular.</p>' +
        '<button class="btn btn-secondary" onclick="setTab(\'jugadores\')">Ir a Jugadores</button>' +
      '</div>';
    }
    return '<div class="card" style="text-align:center;padding:32px;">' +
      '<p class="display" style="font-size:20px;margin:0 0 8px;">Listo para arrancar</p>' +
      '<p style="color:var(--muted);font-size:13.5px;margin:0 0 18px;">' + joined + ' jugadores registrados. Genera la ronda 1 para asignar la energía y los cruces. Cada jugador registrará su mazo de esa ronda (con foto) antes de reportar resultados.</p>' +
      '<button class="btn btn-primary" onclick="generateRound()">Generar ronda 1</button>' +
    '</div>';
  }
  var currentIdx = state.rounds.length - 1;
  var idx = ui.viewRoundIdx === null ? currentIdx : ui.viewRoundIdx;
  var round = state.rounds[idx];
  ensureDeckListener(round.number);
  var isCurrent = idx === currentIdx;
  var currentComplete = state.rounds[currentIdx].matches.every(function (m) { return m.status === 'done'; });
  var canGenerateNext = state.rounds.length < 8 && currentComplete;
  var finished = state.rounds.length === 8 && currentComplete;
  var energy = ENERGY_TYPES.find(function (e) { return e.name === round.energyType; }) || ENERGY_TYPES[0];

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;">';
  html += '<div style="display:flex;align-items:center;gap:10px;">' +
            '<button class="btn btn-secondary btn-sm" ' + (idx <= 0 ? 'disabled' : '') + ' onclick="prevRound()">◀</button>' +
            '<p class="display" style="font-size:20px;margin:0;">Ronda ' + round.number + ' de 8</p>' +
            '<button class="btn btn-secondary btn-sm" ' + (idx >= currentIdx ? 'disabled' : '') + ' onclick="nextRound()">▶</button>' +
          '</div>';
  html += '<span class="energy-badge" style="background:' + energy.color + ';"><span class="energy-dot"></span>' + energy.name + '</span>';
  html += '</div>';

  html += '<div style="display:grid;gap:12px;">';
  round.matches.forEach(function (m) { html += renderMatchCard(state, round, m); });
  html += '</div>';

  if (isCurrent) {
    html += '<div style="margin-top:22px;display:flex;justify-content:center;">';
    if (finished) {
      html += '<span class="badge" style="background:var(--success-bg);color:var(--success-text);border:none;">Torneo completo — revisa la clasificación final</span>';
    } else if (canGenerateNext) {
      html += '<button class="btn btn-primary" onclick="generateRound()">Generar ronda ' + (state.rounds.length + 1) + '</button>';
    } else {
      html += '<p style="color:var(--muted);font-size:13px;">Completa todos los enfrentamientos de esta ronda para continuar.</p>';
    }
    html += '</div>';
  }
  return html;
}

/* ---------- render: analytics tab ---------- */
function computeDeckUsage(st) {
  var totalDecks = 0;
  st.rounds.forEach(function (r) {
    totalDecks += Object.keys(r.deckFlags || {}).length;
  });
  return { totalDecks: totalDecks };
}

function buildRawRows(st) {
  var rows = [];
  st.rounds.forEach(function (r) {
    st.players.forEach(function (p) {
      if (!r.deckFlags || !r.deckFlags[p.id]) return;
      var result = '—';
      r.matches.forEach(function (m) {
        if (m.bye && m.p1 === p.id) { result = 'BYE'; return; }
        if (m.p1 === p.id || m.p2 === p.id) {
          result = (m.status !== 'done') ? 'pendiente' : (m.winner === p.id ? 'V' : 'D');
        }
      });
      rows.push({ round: r.number, player: p.name, result: result });
    });
  });
  return rows;
}

function exportCsv() {
  var rows = buildRawRows(state);
  var csv = 'Ronda,Jugador,Resultado\n';
  rows.forEach(function (r) {
    csv += [r.round, r.player, r.result].map(function (v) {
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(',') + '\n';
  });
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (state.name || 'torneo').replace(/[^a-z0-9]+/gi, '_') + '_mazos.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function renderAnalyticsTab() {
  var usage = computeDeckUsage(state);
  var header = '<h2 style="font-size:24px;margin:0 0 4px;">Analítica de mazos</h2>' +
    '<p style="color:var(--muted);font-size:13.5px;margin:0 0 12px;">Se guarda la captura del mazo de cada jugador en cada ronda. Descarga el CSV con ronda, jugador y resultado para tu propio análisis.</p>' +
    '<div style="margin-bottom:16px;"><button class="btn btn-ghost btn-sm" onclick="exportCsv()">Descargar CSV</button></div>';

  if (usage.totalDecks === 0) {
    return header + '<div class="card"><p style="color:var(--muted);font-size:14px;margin:0;">Todavía no hay mazos registrados. En cuanto se registren en "Ronda actual", aquí verás las estadísticas.</p></div>';
  }

  var html = header + '<div class="card"><p class="display" style="font-size:18px;margin:0 0 8px;">Capturas registradas</p>' +
    '<p style="color:var(--muted);font-size:13.5px;margin:0;">' + usage.totalDecks + ' capturas de mazo guardadas en total. Revísalas en la pestaña "Ronda actual" para identificar los Pokémon y arquetipos usados.</p></div>';
  return html;
}

/* ---------- master render ---------- */
function render() {
  var root = document.getElementById('app');
  if (ui.loading) { root.innerHTML = renderLoading(); return; }
  if (ui.loadError) { root.innerHTML = renderLoadError(); return; }
  if (!state) { root.innerHTML = renderSetup(); return; }

  var currentIdx = state.rounds.length - 1;
  var currentComplete = currentIdx >= 0 ? state.rounds[currentIdx].matches.every(function (m) { return m.status === 'done'; }) : true;
  var finished = state.rounds.length === 8 && currentComplete;
  var unlocked = isUnlocked();

  var tabs = [
    { id: 'ronda', label: 'Ronda actual' },
    { id: 'clasificacion', label: 'Clasificación' },
    { id: 'jugadores', label: 'Jugadores' },
    { id: 'analitica', label: 'Analítica' }
  ];

  var html = '';
  html += '<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel);">';
  html += '<div><p style="margin:0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;">TORNEO</p>' +
            '<h1 style="margin:2px 0 0;font-size:22px;">' + esc(state.name) + '</h1></div>';
  html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<span class="badge">' + state.players.length + ' jugadores</span>' +
            (state.rounds.length === 0
              ? '<span class="badge">Registro abierto</span>'
              : '<span class="badge">Ronda ' + state.rounds.length + '/8</span>') +
            (finished ? '<span class="badge" style="background:var(--success-bg);color:var(--success-text);border:none;">Torneo finalizado</span>' : '') +
            (unlocked
              ? '<span class="badge" style="background:var(--success-bg);color:var(--success-text);border:none;">🔓 Organizador</span><button class="btn btn-secondary btn-sm" onclick="lockOrganizer()">Bloquear</button>'
              : '<span class="badge">🔒 Modo jugador</span><button class="btn btn-ghost btn-sm" onclick="unlockOrganizer()">Desbloquear</button>') +
          '</div></div>';

  html += '<div style="display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;">';
  tabs.forEach(function (t) {
    html += '<button class="tab-btn ' + (ui.tab === t.id ? 'active' : '') + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
  });
  html += '</div>';

  html += '<div style="padding:24px;max-width:900px;margin:0 auto;width:100%;">';
  if (ui.formError === 'save') {
    html += '<div style="margin-bottom:16px;padding:10px 14px;background:var(--danger-dark);border:1px solid var(--danger);border-radius:8px;color:#FBD7D5;font-size:13px;">No se pudo guardar el último cambio. Revisa tu conexión a internet e inténtalo de nuevo.</div>';
  }

  if (ui.tab === 'ronda') html += renderRoundTab();
  else if (ui.tab === 'clasificacion') html += renderStandingsTab();
  else if (ui.tab === 'jugadores') html += renderPlayersTab();
  else if (ui.tab === 'analitica') html += renderAnalyticsTab();

  html += '<div style="margin-top:32px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
  html += '<span style="font-size:12px;color:var(--muted);">Los datos se sincronizan en la nube (Firebase) — cualquier celular con este link ve lo mismo en vivo.</span>';
  if (!ui.confirmReset) {
    html += '<button class="btn btn-danger btn-sm" onclick="showConfirmReset()">Reiniciar torneo</button>';
  } else {
    html += '<div style="display:flex;gap:8px;align-items:center;">' +
              '<span style="font-size:12.5px;color:var(--muted);">Esto borra todo lo registrado. ¿Seguro?</span>' +
              '<button class="btn btn-secondary btn-sm" onclick="cancelReset()">Cancelar</button>' +
              '<button class="btn btn-danger btn-sm" onclick="confirmResetYes()">Sí, reiniciar</button>' +
            '</div>';
  }
  html += '</div>';
  html += '</div>';

  root.innerHTML = html;
}

render();
initFirebase();
</script>
</body>
</html>
